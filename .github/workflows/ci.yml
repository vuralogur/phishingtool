name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # No optional dependency is installed here on purpose: if this job stays
    # green, the core really is pure standard library.
    name: pytest · py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (stdlib core + pytest)
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Console script smoke test
        run: phishingtool analyze tests/samples/phish.eml --iocs

  test-optional:
    # The same suite with the optional extras present: rich report, tldextract
    # domain parsing, oletools macro analysis, OpenCV QR decoding.
    name: pytest · optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with extras
        run: pip install -e ".[cli,deep,dev]"
      - name: Tests
        run: pytest
